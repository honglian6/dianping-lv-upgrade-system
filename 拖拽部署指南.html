<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>部署步骤</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            line-height: 1.8;
        }
        .step {
            background: #f5f5f5;
            padding: 20px;
            margin: 10px 0;
            border-radius: 8px;
        }
        .step-number {
            background: #ff6b6b;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
        }
        button {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #ff5252;
        }
    </style>
</head>
<body>
    <h1>🚀 超简单部署步骤</h1>

    <div class="step">
        <span class="step-number">1</span>
        <strong>点击下方按钮打开部署网站</strong>
        <br><br>
        <button onclick="window.open('https://app.netlify.com/drop')">打开 Netlify Drop</button>
    </div>

    <div class="step">
        <span class="step-number">2</span>
        <strong>找到这个文件夹</strong>
        <br>
        <code style="background:#eee;padding:4px 8px;border-radius:4px;">
            C:\Users\Administrator\Desktop\CC\内容创作能力提升系统
        </code>
    </div>

    <div class="step">
        <span class="step-number">3</span>
        <strong>拖拽文件夹</strong>
        <br>
        用鼠标按住文件夹，拖到网页上显示的虚线框里，然后松开
    </div>

    <div class="step">
        <span class="step-number">4</span>
        <strong>等待上传</strong>
        <br>
        大约10-30秒，会显示上传进度
    </div>

    <div class="step">
        <span class="step-number">5</span>
        <strong>获取网址</strong>
        <br>
        上传完成后会显示一个网址，类似：<code>https://xxxxxx.netlify.app</code>
    </div>

    <div class="step">
        <span class="step-number">6</span>
        <strong>手机访问</strong>
        <br>
        在手机浏览器输入这个网址，就可以使用了！
    </div>

    <hr>
    <p><strong>✅ 免费 | ✅ 无需注册 | ✅ 永久有效</strong></p>
</body>
</html>
